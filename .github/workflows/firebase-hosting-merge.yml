# Deploys the static site in public/ straight to Firebase Hosting.
# No build step: public/index.html is the finished artifact.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/firebase-hosting-merge.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys race; keep the newest.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CYBERLION_SITES_D0500 }}
          channelId: live
          projectId: cyberlion-sites-d0500
